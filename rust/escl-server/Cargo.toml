[package]
name = "escl-server"
version = "0.2.0"
edition = "2021"
description = "eSCL (AirScan) bridge for the Canon DR-S150, driving the ObjC scan engine"
license = "MIT"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
mdns-sd = "0.22"
chrono = "0.4"

[profile.release]
lto = true
